<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archipelago Run — Island Hopper</title>
<style>
  html,body{margin:0;padding:0;background:#0b1e33;height:100%;overflow:hidden;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b1e33;}
  canvas{display:block;background:#87b5d6;box-shadow:0 0 0 1px #123;}
  #help{position:fixed;left:12px;bottom:10px;color:#cfe6ff;font-size:12px;opacity:.85;
    text-shadow:0 1px 2px #000;pointer-events:none;user-select:none;}
  #help b{color:#ffd166;}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
<div id="help">Fly: <b>↑/↓</b> pitch &nbsp; <b>←/→</b> bank &nbsp; <b>Shift</b> throttle up &nbsp; <b>Ctrl</b> throttle down &nbsp; <b>Mouse</b> steer &nbsp; <b>C</b> cockpit view &nbsp; <b>R</b> restart &nbsp; <b>P</b> pause</div>
<script>
"use strict";
/* =====================================================================
   ARCHIPELAGO RUN — Island Hopper (3D REALISTIC)
   A chase-view / cockpit-view flight game over a tropical archipelago.
   Fly the little prop plane "Nusa-1" from Runway 09 on Pulau Karang,
   through 8 golden rings, and land on Runway 27 on Pulau Bintang.
   Pure Canvas 2D software 3D, no network, no external assets.
   Realistic rendering: shaded 3D plane with ground shadow, sunlit /
   shaded island relief with palms and lagoons, volumetric clouds,
   aerial-perspective haze, sun glitter on the sea, volcanic smoke.
   Deterministic world (seeded), so every run and screenshot is
   reproducible.
   ===================================================================== */

// ---------- seeded random (deterministic world) ----------
function mulberry32(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng = mulberry32(20261126);

// ---------- constants ----------
const W = 1280, H = 720;
const canvas = document.getElementById('game');
// Render scale: ?scale=2 renders the canvas backing store at 2x (2560x1440)
// while the CSS size stays 1280x720, so screenshots come out sharp ("HD").
// Default is 1x for fast gameplay; the play-test runs at 1x. The 2x
// backing store is only for screenshots (it saturates the VM's main
// thread in interactive use).
const _scale = Math.max(1, Math.min(2, parseFloat(new URLSearchParams(location.search).get('scale')) || 1));
canvas.width = W * _scale; canvas.height = H * _scale;
canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
const ctx = canvas.getContext('2d');
ctx.scale(_scale, _scale);

// World: x = east (m), z = north (m, forward = +z), y = altitude (m).
// The route runs from z=0 (Pulau Karang) to z=9000 (Pulau Bintang).
const ROUTE_LEN = 9000;
const RING_Z = [900, 1900, 2900, 3900, 4900, 5900, 6900, 7900];
const RINGS = RING_Z.map((z,i)=>({
  z, x: [260,-320,420,-180,80,-420,300,-120][i],
  y: [260,340,300,420,360,300,380,320][i],
  r: 90, passed:false
}));
// Islands: {x, z, rx, rz, h} — drawn as green blobs on the sea.
const ISLANDS = [
  {x:0,    z:0,    rx:900, rz:700, h:26,  name:"PULAU KARANG"},   // start
  {x:420,  z:1500, rx:520, rz:420, h:60},
  {x:-520, z:2600, rx:640, rz:480, h:120},
  {x:180,  z:3900, rx:430, rz:380, h:40},
  {x:-280, z:5200, rx:560, rz:440, h:90},
  {x:520,  z:6400, rx:480, rz:400, h:150},
  {x:-80,  z:7700, rx:560, rz:460, h:70},
  {x:0,    z:9000, rx:980, rz:760, h:30,  name:"PULAU BINTANG"},  // destination
];
// Distant volcanic peaks on the horizon (parallax silhouettes).
const PEAKS = [
  {x:-2600,z:11500,h:900},{x:-900,z:12500,h:1200},{x:700,z:12000,h:1050},
  {x:2300,z:11500,h:800},{x:3600,z:12800,h:950}
];
// Clouds: {x, y, z, s}
const CLOUDS = [];
for (let i=0;i<26;i++){
  CLOUDS.push({x:(rng()-0.5)*9000, y:520+rng()*420, z:rng()*11000, s:90+rng()*190});
}
// Birds for life.
const BIRDS = [];
for (let i=0;i<9;i++) BIRDS.push({x:(rng()-0.5)*3000, y:200+rng()*260, z:600+rng()*7000, ph:rng()*6.28});

// ---------- game state ----------
const S = {
  // plane
  x:0, y:2, z:0,            // position (m); y = height above sea
  heading:0,                // radians, 0 = north (+z)
  pitch:0, roll:0,          // radians
  speed:0,                  // m/s (knots shown = m/s * 1.944)
  throttle:0.35,
  // flight
  mode:'takeoff',           // takeoff | flying | landed | crashed | done
  rings:0, score:0,
  time:0, started:false,
  msg:'', msgT:0,
  view:'chase',             // chase | cockpit
  paused:false,
  camShake:0,
  prop:0,
  best:0,
  airTime:0,                // seconds since takeoff (collision grace)
};
const GROUND_Y = 2;         // runway height
const TAKEOFF_SPEED = 32;   // m/s needed to lift off
const MAX_SPEED = 95;
const MIN_SPEED = 0;

// ---------- input ----------
const keys = {};
let mouseX = null, mouseActive = false;
window.addEventListener('keydown', e=>{
  keys[e.key.toLowerCase()] = true;
  if (e.key===' '){ e.preventDefault(); }
  if (e.key.toLowerCase()==='c'){ S.view = S.view==='chase' ? 'cockpit' : 'chase'; }
  if (e.key.toLowerCase()==='r'){ resetGame(); }
  if (e.key.toLowerCase()==='p'){ S.paused = !S.paused; }
});
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('mousemove', e=>{
  const r = canvas.getBoundingClientRect();
  mouseX = (e.clientX - r.left) / r.width * W;
  mouseActive = true;
});
canvas.addEventListener('mouseleave', ()=>{ mouseActive = false; });
canvas.addEventListener('click', ()=>{ if(!S.started) startGame(); });

function startGame(){ S.started = true; S.mode='takeoff'; showMsg('THROTTLE UP — SHIFT, THEN PULL UP', 4); }
function showMsg(t, dur){ S.msg=t; S.msgT=dur; }
function resetGame(){
  S.x=0; S.y=GROUND_Y; S.z=0; S.heading=0; S.pitch=0; S.roll=0;
  S.speed=0; S.throttle=0.35; S.mode='takeoff'; S.rings=0; S.score=0;
  S.time=0; S.started=false; S.msg=''; S.msgT=0; S.paused=false;
  S.airTime=0;
  RINGS.forEach(r=>r.passed=false);
}

// ---------- helpers ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
// Sun direction (for shading): sun sits high to the east (right of screen).
const SUN = {x: 0.55, y: 0.72};   // unit-ish direction the light comes from
// Aerial perspective: how much a distant object fades toward the horizon
// haze colour. d is the camera distance in metres.
function haze(d){
  // 0 = no haze (close), 1 = fully haze (far). Starts ~2.5km, full ~11km.
  return clamp((d - 2500) / 8500, 0, 0.85);
}
function hazeColor(base, d){
  // Blend an [r,g,b] colour toward the horizon haze (#bcd6e8).
  const t = haze(d);
  const h = [188, 214, 232];
  return 'rgb(' + Math.round(lerp(base[0], h[0], t)) + ',' +
    Math.round(lerp(base[1], h[1], t)) + ',' + Math.round(lerp(base[2], h[2], t)) + ')';
}
// Project a world point to screen (chase camera behind the plane).
// Camera sits behind + above the plane, looking along heading.
function project(px, py, pz){
  // relative to plane
  const dx = px - S.x, dy = py - S.y, dz = pz - S.z;
  // rotate by -heading so forward = +z
  const ch = Math.cos(S.heading), sh = Math.sin(S.heading);
  const rx = dx*ch - dz*sh;
  const rz = dx*sh + dz*ch;
  // camera offset: behind plane, above it
  const camBack = 26, camUp = 7;
  const cz = rz + camBack;                 // distance ahead of camera
  if (cz < 2) return null;
  const f = 620;                           // focal length
  // horizon drops when the nose rises (looking up)
  const horizon = H*0.46 + S.pitch*420;
  const sx = W/2 + (rx - S.roll*8) * f / cz;
  // vertical: a point (camUp - dy) below the camera appears that far
  // below the horizon, scaled by perspective.
  const sy = horizon + (camUp - dy) * f / cz;
  return {x:sx, y:sy, d:cz, scale:f/cz};
}
// Ground height at (x,z): 0 = sea, island height on land.
function groundHeight(x, z){
  let h = 0;
  for (const isl of ISLANDS){
    const dx=(x-isl.x)/isl.rx, dz=(z-isl.z)/isl.rz;
    const d2 = dx*dx+dz*dz;
    if (d2 < 1){
      const t = 1-d2;
      h = Math.max(h, isl.h * t*t);
    }
  }
  return h;
}
// The surface the plane can hit: runways are flat at GROUND_Y, the
// island hills rise above it elsewhere, the sea is at 0.
function surfaceHeight(x, z){
  if (Math.abs(x) < 20 && ((z>=-10 && z<=430) || (z>=8990 && z<=9430))) return GROUND_Y;
  return groundHeight(x, z);
}

// ---------- update ----------
function update(dt){
  if (S.paused || !S.started) return;
  S.time += dt;
  S.prop += dt * (4 + S.throttle*30);
  if (S.msgT>0) S.msgT -= dt;

  // --- controls ---
  const pitchIn = (keys['arrowup']||keys['w']?1:0) - (keys['arrowdown']||keys['s']?1:0);
  const rollIn  = (keys['arrowright']||keys['d']?1:0) - (keys['arrowleft']||keys['a']?1:0);
  if (keys['shift']) S.throttle = clamp(S.throttle + dt*0.5, 0, 1);
  if (keys['control']) S.throttle = clamp(S.throttle - dt*0.5, 0, 1);
  // mouse steering: bank toward mouse x
  if (mouseActive && mouseX!==null){
    const steer = (mouseX - W/2) / (W/2);      // -1..1
    S.roll = clamp(S.roll + steer*dt*1.4, -0.9, 0.9);
  }
  // keyboard roll
  S.roll = clamp(S.roll + rollIn*dt*1.6, -0.9, 0.9);
  if (!rollIn && !(mouseActive && mouseX!==null)) S.roll = lerp(S.roll, 0, dt*1.2);
  // pitch follows input; auto-level gently
  const targetPitch = pitchIn*0.28;
  S.pitch = lerp(S.pitch, targetPitch, dt*1.6);

  // --- physics ---
  const onGround = S.y <= GROUND_Y+0.5;
  if (S.mode==='takeoff'){
    S.speed = lerp(S.speed, S.throttle*MAX_SPEED, dt*0.25);
    if (S.speed > TAKEOFF_SPEED && pitchIn>0){
      S.mode='flying';
      S.y = GROUND_Y + 4;    // a hop off the runway so the ground check
      S.airTime = 0;         // does not fire on the takeoff frame itself
      showMsg('AIRBORNE — FLY THROUGH THE GOLDEN RINGS', 3.5);
    }
    if (onGround && S.mode==='takeoff'){ S.y = GROUND_Y; }
  } else if (S.mode==='flying' || S.mode==='done'){
    S.airTime += dt;
    const accel = (S.throttle*MAX_SPEED - S.speed)*0.22;
    S.speed = clamp(S.speed + accel*dt, MIN_SPEED, MAX_SPEED);
    // climb / descend with pitch; speed bleeds in a climb
    S.y += Math.sin(S.pitch)*S.speed*dt;
    if (S.pitch>0.05) S.speed = Math.max(S.speed - S.pitch*dt*14, 26);
    // turn with roll
    S.heading += -S.roll * (S.speed/60) * dt * 0.55;
    // gentle sink if too slow
    if (S.speed < 30) S.y -= (30-S.speed)*dt*0.35;
  }
  // forward motion
  const vx = Math.sin(S.heading)*S.speed, vz = Math.cos(S.heading)*S.speed;
  S.x += vx*dt; S.z += vz*dt;
  if (S.mode==='takeoff'){ S.x = clamp(S.x, -60, 60); }  // stay on runway line

  // --- rings ---
  for (const r of RINGS){
    if (r.passed) continue;
    const dx=S.x-r.x, dy=S.y-r.y, dz=S.z-r.z;
    const d=Math.sqrt(dx*dx+dy*dy+dz*dz);
    if (d < r.r){
      r.passed=true; S.rings++; S.score += 100;
      showMsg('RING '+S.rings+'/8  +100', 2);
      S.camShake = 0.35;
    }
  }
  // --- terrain collision (after a short grace so takeoff never trips it) ---
  const gh = surfaceHeight(S.x, S.z);
  if (S.mode==='flying' && S.airTime > 0.8 && S.y <= gh+1){
    if (S.z > 8300 && S.z < 9700 && Math.abs(S.x) < 320 && S.speed < 42 && Math.abs(S.pitch) < 0.2){
      // landing on Pulau Bintang runway
      S.mode='done'; S.speed=0; S.y=gh;
      S.score += 500 + S.rings*50;
      showMsg('LANDED ON PULAU BINTANG — SCORE '+S.score, 6);
    } else {
      S.mode='crashed';
      showMsg('CRASHED — PRESS R TO FLY AGAIN', 6);
      S.camShake = 1.0;
    }
  }
  if (S.mode==='flying' && S.y < 1){ S.y=1; }
  // --- bounds ---
  if (S.z > 10200){ S.z = 10200; S.heading = Math.PI; }
  if (S.z < -300){ S.z=-300; S.heading=0; }
  S.x = clamp(S.x, -4200, 4200);
  if (S.camShake>0) S.camShake -= dt;
  S.best = Math.max(S.best, S.score);
}

// ---------- drawing ----------
function drawSky(){
  // Tropical late-morning sky: deep zenith blue, pale warm horizon band.
  const horizon = H*0.46 + S.pitch*420;
  const g = ctx.createLinearGradient(0,0,0,Math.max(horizon,1));
  g.addColorStop(0,'#1e5da8');
  g.addColorStop(0.45,'#4f8fc9');
  g.addColorStop(0.78,'#9cc8e8');
  g.addColorStop(1,'#dceef7');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,Math.max(horizon,1));
  // Warm haze band right above the horizon (sun-side).
  const hg = ctx.createLinearGradient(0,horizon-70,0,horizon);
  hg.addColorStop(0,'rgba(255,232,190,0)');
  hg.addColorStop(1,'rgba(255,232,190,0.55)');
  ctx.fillStyle=hg; ctx.fillRect(0,horizon-70,W,70);
  // Sun: bright core + wide halo + a faint secondary glow.
  const sg = ctx.createRadialGradient(1060,110,8, 1060,110,220);
  sg.addColorStop(0,'rgba(255,250,220,0.95)');
  sg.addColorStop(0.25,'rgba(255,226,130,0.55)');
  sg.addColorStop(0.6,'rgba(255,210,110,0.16)');
  sg.addColorStop(1,'rgba(255,210,110,0)');
  ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(1060,110,220,0,6.283); ctx.fill();
  ctx.fillStyle='#fff6cf'; ctx.beginPath(); ctx.arc(1060,110,36,0,6.283); ctx.fill();
  ctx.fillStyle='#fffdf2'; ctx.beginPath(); ctx.arc(1060,110,24,0,6.283); ctx.fill();
}
function drawClouds(){
  // Volumetric cumulus: a cluster of shaded puffs — bright sunlit tops,
  // soft blue-grey bellies — instead of a single flat ellipse.
  for (const c of CLOUDS){
    const p = project(c.x, c.y, c.z);
    if (!p) continue;
    const s = c.s * p.scale * 0.5;
    if (s<3 || s>420) continue;
    const hz = haze(p.d);
    // Puff layout (deterministic per cloud, from its size + position).
    const seed = (c.x*0.37 + c.z*0.11) % 6.28;
    const puffs = [
      [0, 0, 1.0], [0.62, 0.10, 0.72], [-0.6, 0.12, 0.7],
      [0.28, -0.16, 0.62], [-0.3, -0.14, 0.58], [0.95, 0.22, 0.5],
    ];
    // Belly (shaded underside) first, then the lit tops.
    for (const [ox, oy, r] of puffs){
      const px = p.x + ox*s, py = p.y + oy*s + s*0.10;
      const rr = s*r*0.5;
      ctx.fillStyle = 'rgba(148,172,196,' + (0.55*(1-hz*0.5)) + ')';
      ctx.beginPath(); ctx.ellipse(px, py, rr, rr*0.62, 0, 0, 6.283); ctx.fill();
    }
    for (const [ox, oy, r] of puffs){
      const px = p.x + ox*s, py = p.y + oy*s;
      const rr = s*r*0.5;
      const grad = ctx.createRadialGradient(px-rr*0.25, py-rr*0.3, rr*0.1, px, py, rr);
      grad.addColorStop(0,'rgba(255,255,255,' + (0.98*(1-hz*0.6)) + ')');
      grad.addColorStop(1,'rgba(226,238,248,' + (0.9*(1-hz*0.6)) + ')');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.ellipse(px, py, rr, rr*0.62, 0, 0, 6.283); ctx.fill();
    }
  }
  // NOTE: cloud shadows on the sea are drawn in drawSeaAndIslands
  // (after the sea is painted), otherwise the sea would cover them.
}
function drawPeaks(){
  for (const pk of PEAKS){
    const p = project(pk.x, 0, pk.z);
    if (!p) continue;
    const w = pk.h*2.4*p.scale*0.6, h = pk.h*p.scale*0.6;
    if (w<4) continue;
    // Aerial perspective: far volcanoes fade strongly into the haze.
    const hz = haze(p.d);
    // Soft vertical shading (darker base, lighter summit) — no hard
    // left/right split, which reads as a faceted pyramid up close.
    const grad = ctx.createLinearGradient(p.x, p.y, p.x, p.y-h*1.25);
    grad.addColorStop(0, hazeColor([58, 80, 108], p.d));
    grad.addColorStop(0.7, hazeColor([86, 118, 152], p.d));
    grad.addColorStop(1, hazeColor([120, 152, 184], p.d));
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(p.x-w, p.y);
    ctx.quadraticCurveTo(p.x-w*0.45, p.y-h*0.75, p.x, p.y-h*1.25);
    ctx.quadraticCurveTo(p.x+w*0.45, p.y-h*0.7, p.x+w, p.y);
    ctx.closePath(); ctx.fill();
    // Soft rounded snow cap hugging the summit (not a diamond).
    ctx.fillStyle = hazeColor([238, 244, 250], p.d);
    ctx.beginPath();
    ctx.moveTo(p.x-w*0.16, p.y-h*0.82);
    ctx.quadraticCurveTo(p.x, p.y-h*1.30, p.x+w*0.16, p.y-h*0.82);
    ctx.quadraticCurveTo(p.x+w*0.07, p.y-h*0.68, p.x, p.y-h*0.72);
    ctx.quadraticCurveTo(p.x-w*0.07, p.y-h*0.68, p.x-w*0.16, p.y-h*0.82);
    ctx.closePath(); ctx.fill();
    // Lazy smoke plume drifting off the crater (animated by time).
    const drift = Math.sin(S.time*0.4 + pk.x)*w*0.08;
    ctx.fillStyle = 'rgba(235,238,242,' + (0.45*(1-hz)) + ')';
    ctx.beginPath();
    ctx.ellipse(p.x + drift, p.y-h*1.28, w*0.16, h*0.10, 0, 0, 6.283); ctx.fill();
    ctx.beginPath();
    ctx.ellipse(p.x + drift*1.8, p.y-h*1.42, w*0.11, h*0.08, 0, 0, 6.283); ctx.fill();
  }
}
function drawSeaAndIslands(){
  // Sea: deep tropical gradient + animated sun glitter + wave sparkle.
  const horizon = H*0.46 + S.pitch*420;
  const g = ctx.createLinearGradient(0,horizon,0,H);
  g.addColorStop(0,'#4aa3cf');
  g.addColorStop(0.35,'#2a7fb8');
  g.addColorStop(0.7,'#1a5f92');
  g.addColorStop(1,'#0f4266');
  ctx.fillStyle=g; ctx.fillRect(0,horizon,W,H-horizon);
  // Sun glitter path on the water (shimmering, animated).
  for (let i=0;i<16;i++){
    const y = horizon + 14 + i*20 + Math.sin(S.time*0.8+i*1.7)*3;
    const w = 50 + (i%3)*46 + Math.sin(S.time*1.3+i)*12;
    ctx.fillStyle='rgba(255,238,170,' + (0.30 - i*0.012) + ')';
    ctx.fillRect(1010-w/2, y, w, 2.5);
  }
  // Wave sparkles scattered on the swell.
  ctx.fillStyle='rgba(255,255,255,0.20)';
  for (let i=0;i<26;i++){
    const wx = (i*197.3 + S.time*12) % W;
    const wy = horizon + 30 + ((i*89.7) % Math.max(1,(H-horizon-40)));
    ctx.fillRect(wx, wy, 7, 1.6);
  }
  // Cloud shadows on the sea: soft dark ellipses projected straight down
  // from each cloud. The strongest depth cue in the scene — it ties the
  // sky to the water and makes the 3D volume read. Drawn after the sea
  // (so it is visible) and before the islands (so land covers it).
  for (const c of CLOUDS){
    const sp = project(c.x - 60, 0, c.z + 40);
    if (!sp || sp.scale < 0.02) continue;
    const s = c.s * sp.scale * 0.5;
    if (s < 4 || s > 500) continue;
    const hz = haze(sp.d);
    const shR = s * 1.1;
    const shGrad = ctx.createRadialGradient(sp.x, sp.y, 2, sp.x, sp.y, shR);
    shGrad.addColorStop(0, 'rgba(8,30,50,' + (0.20*(1-hz*0.5)) + ')');
    shGrad.addColorStop(1, 'rgba(8,30,50,0)');
    ctx.fillStyle = shGrad;
    ctx.beginPath(); ctx.ellipse(sp.x, sp.y, shR, shR*0.22, 0, 0, 6.283); ctx.fill();
  }
  // Islands, far to near, as projected boundary polygons.
  const sorted = ISLANDS.slice().sort((a,b)=>b.z-a.z);
  for (const isl of sorted){
    const N = 28, pts = [];
    for (let i=0;i<N;i++){
      const a = i/N * Math.PI*2;
      const wx = isl.x + Math.cos(a)*isl.rx;
      const wz = isl.z + Math.sin(a)*isl.rz;
      const p = project(wx, groundHeight(wx,wz)*0.4, wz);
      if (p) pts.push(p);
    }
    if (pts.length < 3) continue;
    let cx=0, cy=0;
    for (const p of pts){ cx+=p.x; cy+=p.y; }
    cx/=pts.length; cy/=pts.length;
    const centre = project(isl.x, isl.h*0.5, isl.z);
    const dist = centre ? centre.d : 4000;
    const hz = haze(dist);
    // Drop shadow: a soft dark ellipse on the water under the island,
    // offset toward the camera, so the island reads as rising out of
    // the sea instead of a flat sticker on it.
    const shRx = Math.max(12, Math.abs(pts[0].x-cx)*0.9 + 30);
    const shRy = Math.max(6, Math.abs(pts[0].y-cy)*0.28 + 10);
    ctx.fillStyle = 'rgba(10,40,60,' + (0.28*(1-hz*0.6)) + ')';
    ctx.beginPath();
    ctx.ellipse(cx, cy + Math.max(4, (cy - (centre?centre.y:cy))*0.08 + 8), shRx, shRy, 0, 0, 6.283);
    ctx.fill();
    // Shallow turquoise lagoon ring just off the beach.
    ctx.fillStyle = 'rgba(64,190,190,' + (0.45*(1-hz*0.7)) + ')';
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath(); ctx.fill();
    // Beach: warm sand, slightly darker at the waterline.
    ctx.fillStyle = hazeColor([232, 214, 158], dist);
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath(); ctx.fill();
    // Green interior, shrunk toward the centroid, with a sunlit side
    // (right/east) and a shaded side (left/west) for real 3D relief.
    const shrink = (f)=>pts.map(p=>({x:cx+(p.x-cx)*f, y:cy+(p.y-cy)*f}));
    const inner = shrink(0.82);
    const grad = ctx.createLinearGradient(cx-90, cy, cx+90, cy);
    grad.addColorStop(0, hazeColor([52, 122, 62], dist));
    grad.addColorStop(0.55, hazeColor([74, 155, 74], dist));
    grad.addColorStop(1, hazeColor([96, 178, 88], dist));
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.moveTo(inner[0].x, inner[0].y);
    for (let i=1;i<inner.length;i++) ctx.lineTo(inner[i].x, inner[i].y);
    ctx.closePath(); ctx.fill();
    // Dome highlight: a radial sunlit glow centred on the island's
    // high point, fading to transparent at the rim — this is what
    // makes the island read as a rounded 3D hill instead of a flat disc.
    const domeR = Math.max(20, Math.abs(inner[0].x-cx) + 30);
    const dome = ctx.createRadialGradient(cx, cy-8, 4, cx, cy-8, domeR);
    dome.addColorStop(0, 'rgba(190,230,150,' + (0.55*(1-hz*0.7)) + ')');
    dome.addColorStop(0.6, 'rgba(140,200,110,' + (0.22*(1-hz*0.7)) + ')');
    dome.addColorStop(1, 'rgba(140,200,110,0)');
    ctx.fillStyle = dome;
    ctx.beginPath(); ctx.moveTo(inner[0].x, inner[0].y);
    for (let i=1;i<inner.length;i++) ctx.lineTo(inner[i].x, inner[i].y);
    ctx.closePath(); ctx.fill();
    // Near-edge cliff shade: a dark crescent along the bottom (camera)
    // edge, simulating the vertical face of the island in shadow.
    ctx.fillStyle = 'rgba(20,60,30,' + (0.30*(1-hz*0.6)) + ')';
    ctx.beginPath();
    ctx.ellipse(cx, cy + (inner[0].y-cy)*0.55, Math.abs(inner[0].x-cx)*0.95, Math.abs(inner[0].y-cy)*0.45, 0, 0, Math.PI);
    ctx.fill();
    // Vegetation speckle: darker jungle dots scattered on the green.
    const dots = Math.min(26, Math.floor(isl.rx*isl.rz/9000));
    ctx.fillStyle = hazeColor([38, 96, 48], dist);
    for (let i=0;i<dots;i++){
      const a = (i*2.39996) % 6.283;      // golden-angle scatter
      const rr = 0.55 + (i%5)*0.06;
      const px = cx + Math.cos(a)*isl.rx*0.32*rr*0.5;
      const py = cy + Math.sin(a)*isl.rz*0.32*rr*0.3;
      ctx.beginPath(); ctx.arc(px, py, 2.2, 0, 6.283); ctx.fill();
    }
    // (Palms removed: island-fringe palms were drawn at screen-space
    // offsets that did not sit on the island's 3D surface, so they read
    // as trees floating in the air. Trees now live beside the runways,
    // planted on the ground in drawRunway.)
    // Hill cap for tall islands: a shaded dome (light on top, dark base).
    if (isl.h>40){
      const hill = shrink(0.38);
      const hillGrad = ctx.createLinearGradient(cx, hill[0].y-14, cx, hill[0].y+6);
      hillGrad.addColorStop(0, hazeColor([120, 190, 100], dist));
      hillGrad.addColorStop(1, hazeColor([46, 104, 54], dist));
      ctx.fillStyle = hillGrad;
      ctx.beginPath(); ctx.moveTo(hill[0].x, hill[0].y-6);
      for (let i=1;i<hill.length;i++) ctx.lineTo(hill[i].x, hill[i].y-6);
      ctx.closePath(); ctx.fill();
    }
    // Island name (only when it fits on screen). Drawn with a dark
    // outline so it stays readable over runway, sea or mountain, and
    // lifted above the island centre so it never sits on the runway.
    if (isl.name){
      const c = project(isl.x, isl.h, isl.z);
      if (c && c.d>250 && c.d<6000 && c.x>60 && c.x<W-60 && c.y>40 && c.y<H-40){
        ctx.font='bold 13px ui-monospace, monospace';
        ctx.textAlign='center';
        ctx.fillStyle='rgba(8,20,36,0.85)';
        ctx.fillText(isl.name, c.x+1, c.y-19);
        ctx.fillStyle='rgba(255,255,255,0.95)';
        ctx.fillText(isl.name, c.x, c.y-20);
        ctx.textAlign='left';
      }
    }
  }
}
function drawRunway(x, z0, headingDeg, label){
  // A runway strip starting at its threshold (x, z0) and running north.
  // Drawn as short segments so the part behind the camera is skipped
  // instead of dropping the whole strip.
  const len=420, wid=34;
  const hd = headingDeg*Math.PI/180;
  const dx=Math.sin(hd), dz=Math.cos(hd);
  const px=Math.cos(hd), pz=-Math.sin(hd);
  const SEG = 30;   // segment length (m)
  const RWY_Y = GROUND_Y + 0.4;   // runways are flat, not island-peak high
  ctx.fillStyle='#3a3f46';
  for (let s=0; s<len; s+=SEG){
    const zA=z0+dz*s, zB=z0+dz*Math.min(s+SEG,len);
    const xA=x+dx*s, xB=x+dx*Math.min(s+SEG,len);
    const corners = [
      [xA-px*wid/2, zA-pz*wid/2], [xB-px*wid/2, zB-pz*wid/2],
      [xB+px*wid/2, zB+pz*wid/2], [xA+px*wid/2, zA+pz*wid/2],
    ];
    const pts = corners.map(c=>project(c[0], RWY_Y, c[1]));
    if (pts.some(p=>!p)) continue;
    ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); ctx.lineTo(pts[1].x,pts[1].y);
    ctx.lineTo(pts[2].x,pts[2].y); ctx.lineTo(pts[3].x,pts[3].y);
    ctx.closePath(); ctx.fill();
  }
  // centreline dashes (only the visible ones)
  ctx.fillStyle='#f5f5f5';
  for (let t=30; t<len; t+=60){
    const cx=x+dx*t, cz2=z0+dz*t;
    const a=project(cx-px*1.2, RWY_Y, cz2-pz*1.2);
    const b=project(cx+px*1.2, RWY_Y, cz2+pz*1.2);
    const c2=project(cx+dx*14-px*1.2, RWY_Y, cz2+dz*14-pz*1.2);
    const d2=project(cx+dx*14+px*1.2, RWY_Y, cz2+dz*14+pz*1.2);
    if (a&&b&&c2&&d2){
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(c2.x,c2.y);
      ctx.lineTo(d2.x,d2.y); ctx.lineTo(b.x,b.y); ctx.closePath(); ctx.fill();
    }
  }
  // threshold label
  const lp = project(x, RWY_Y, z0+10);
  if (lp && lp.d<2500 && lp.x>30 && lp.x<W-30){
    ctx.fillStyle='#fff'; ctx.font='bold 15px ui-monospace, monospace';
    ctx.textAlign='center'; ctx.fillText(label, lp.x, lp.y-8); ctx.textAlign='left';
  }
  // --- runway edge lines: solid white lines along both edges ---
  ctx.strokeStyle='rgba(245,245,245,0.9)';
  for (const side of [-1, 1]){
    ctx.lineWidth = 2;
    ctx.beginPath();
    let started = false;
    for (let s=0; s<=len; s+=SEG){
      const ex = x + dx*s + px*side*(wid/2 - 1.5);
      const ez = z0 + dz*s + pz*side*(wid/2 - 1.5);
      const p = project(ex, RWY_Y, ez);
      if (!p) continue;
      if (!started){ ctx.moveTo(p.x, p.y); started = true; }
      else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
  }
  // --- fence: posts + two rails along both sides, just outside the runway ---
  for (const side of [-1, 1]){
    const fx = wid/2 + 8;
    // rails (two horizontal lines, at 1.2 m and 2.2 m height)
    for (const rh of [1.2, 2.2]){
      ctx.strokeStyle='rgba(220,220,220,0.75)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      let started = false;
      for (let s=0; s<=len; s+=SEG){
        const ex = x + dx*s + px*side*fx;
        const ez = z0 + dz*s + pz*side*fx;
        const p = project(ex, RWY_Y + rh, ez);
        if (!p) continue;
        if (!started){ ctx.moveTo(p.x, p.y); started = true; }
        else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }
    // posts every 40 m
    ctx.strokeStyle='rgba(200,200,200,0.9)';
    ctx.lineWidth = 2;
    for (let s=0; s<=len; s+=40){
      const ex = x + dx*s + px*side*fx;
      const ez = z0 + dz*s + pz*side*fx;
      const base = project(ex, RWY_Y, ez);
      const top = project(ex, RWY_Y + 2.4, ez);
      if (!base || !top) continue;
      ctx.beginPath(); ctx.moveTo(base.x, base.y); ctx.lineTo(top.x, top.y); ctx.stroke();
    }
  }
  // --- palm trees planted on the ground beside the runway (outside the fence) ---
  for (const side of [-1, 1]){
    const tx = wid/2 + 22;
    for (let s=30; s<=len; s+=60){
      const ex = x + dx*s + px*side*tx;
      const ez = z0 + dz*s + pz*side*tx;
      const base = project(ex, RWY_Y, ez);
      const top = project(ex, RWY_Y + 7, ez);
      if (!base || !top) continue;
      const hgt = base.y - top.y;
      if (hgt < 3) continue;
      const trunkW = Math.max(1.2, hgt * 0.06);
      ctx.strokeStyle = '#6b4e2e';
      ctx.lineWidth = trunkW;
      ctx.beginPath(); ctx.moveTo(base.x, base.y); ctx.lineTo(top.x, top.y); ctx.stroke();
      // fronds: a small green crown at the top of the trunk
      const cr = hgt * 0.55;
      ctx.fillStyle = '#2f8240';
      ctx.beginPath(); ctx.ellipse(top.x, top.y, cr, cr*0.32, -0.35, 0, 6.283); ctx.fill();
      ctx.beginPath(); ctx.ellipse(top.x, top.y, cr, cr*0.32, 0.35, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#3a9a4e';
      ctx.beginPath(); ctx.ellipse(top.x, top.y - cr*0.15, cr*0.7, cr*0.28, 0, 0, 6.283); ctx.fill();
    }
  }
}
function drawRings(){
  for (const r of RINGS){
    if (r.passed) continue;
    const p = project(r.x, r.y, r.z);
    if (!p) continue;
    const rad = r.r*p.scale;
    if (rad<2 || rad>900) continue;
    const hz = haze(p.d);
    const alpha = 1 - hz*0.55;
    // Outer glow (soft halo).
    ctx.strokeStyle='rgba(255,200,60,' + (0.35*alpha).toFixed(3) + ')';
    ctx.lineWidth=Math.max(2,rad*0.16);
    ctx.beginPath(); ctx.ellipse(p.x,p.y,rad,rad*0.92,0,0,6.283); ctx.stroke();
    // Torus body: shaded gold — bright on top, deep amber below.
    const rg = ctx.createLinearGradient(p.x, p.y-rad, p.x, p.y+rad);
    rg.addColorStop(0,'rgba(255,232,150,' + alpha.toFixed(3) + ')');
    rg.addColorStop(0.5,'rgba(255,199,60,' + alpha.toFixed(3) + ')');
    rg.addColorStop(1,'rgba(190,120,20,' + alpha.toFixed(3) + ')');
    ctx.strokeStyle=rg; ctx.lineWidth=Math.max(2,rad*0.07);
    ctx.beginPath(); ctx.ellipse(p.x,p.y,rad,rad*0.92,0,0,6.283); ctx.stroke();
    // Specular highlight along the top arc.
    ctx.strokeStyle='rgba(255,246,200,' + (0.9*alpha).toFixed(3) + ')';
    ctx.lineWidth=Math.max(1,rad*0.02);
    ctx.beginPath(); ctx.ellipse(p.x,p.y,rad,rad*0.92,0,Math.PI*1.15,Math.PI*1.85); ctx.stroke();
    // Number tag.
    if (rad>26){
      ctx.fillStyle='rgba(122,82,0,' + alpha.toFixed(3) + ')';
      ctx.font='bold '+Math.max(11,rad*0.22)+'px ui-monospace, monospace';
      ctx.textAlign='center'; ctx.fillText(String(RINGS.indexOf(r)+1), p.x, p.y+rad*0.08);
      ctx.textAlign='left';
    }
  }
}
function drawBirds(){
  ctx.strokeStyle='rgba(30,40,60,0.85)'; ctx.lineWidth=2;
  for (const b of BIRDS){
    const p = project(b.x + Math.sin(S.time*0.6+b.ph)*30, b.y, b.z);
    if (!p || p.scale<0.05 || p.scale>0.6) continue;
    const s = 10*p.scale*3;
    const flap = Math.sin(S.time*6+b.ph)*s*0.4;
    ctx.beginPath();
    ctx.moveTo(p.x-s, p.y-flap); ctx.quadraticCurveTo(p.x, p.y+flap*0.4, p.x+s, p.y-flap);
    ctx.stroke();
  }
}
function drawPlane(){
  // Chase view: the Nusa-1 seen from BEHIND and slightly ABOVE, the way
  // a real chase camera sits. The fuselage is FORESHORTENED — you look
  // along it toward the horizon, not down on it from above — so the plane
  // reads as flying FORWARD, not standing on its tail pointing at the sky.
  // The wings are the wide horizontal feature; the tail (closest to the
  // camera) is big; the nose and propeller are small, far away, up-screen.
  const cx = W/2, cy = H*0.60;
  // --- ground shadow: project the plane's (x,z) onto the surface below.
  const gh = surfaceHeight(S.x, S.z);
  const shadowP = project(S.x, gh + 0.5, S.z);
  if (shadowP && S.y > 8){
    const hgt = clamp(S.y - gh, 0, 600);
    const sw = clamp(120 - hgt*0.12, 26, 120);
    const alpha = clamp(0.34 - hgt*0.00045, 0.06, 0.34);
    ctx.fillStyle = 'rgba(10,30,45,' + alpha.toFixed(3) + ')';
    ctx.beginPath(); ctx.ellipse(shadowP.x, shadowP.y, sw, sw*0.22, 0, 0, 6.283); ctx.fill();
  }
  const bank = S.roll;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-bank*0.9);
  const sh = S.camShake>0 ? (Math.random()-0.5)*S.camShake*10 : 0;
  ctx.translate(sh, sh*0.5);
  // --- propeller: a SMALL translucent disc far ahead (top of the sprite),
  // because the nose is the farthest part from the chase camera.
  const pa = S.prop;
  ctx.fillStyle='rgba(60,60,60,0.14)';
  ctx.beginPath(); ctx.ellipse(0, -30, 20, 5, 0, 0, 6.283); ctx.fill();
  ctx.fillStyle='rgba(30,30,30,0.5)';
  ctx.beginPath(); ctx.ellipse(0, -30, 17, 2.2, pa, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, -30, 17, 2.2, pa+1.57, 0, 6.283); ctx.fill();
  ctx.fillStyle='#d8d4c8'; ctx.beginPath(); ctx.arc(0,-30,3.4,0,6.283); ctx.fill();
  ctx.fillStyle='#c93a2c'; ctx.beginPath(); ctx.arc(0,-30,1.8,0,6.283); ctx.fill();
  // --- wings: the wide horizontal feature, seen from above. Slight
  // dihedral (tips a touch higher, toward the nose) so they read as 3D.
  const wingGrad = ctx.createLinearGradient(0,-14,0,16);
  wingGrad.addColorStop(0,'#f6f3ea');
  wingGrad.addColorStop(0.6,'#ddd8c8');
  wingGrad.addColorStop(1,'#b3ae9c');
  ctx.fillStyle = wingGrad;
  ctx.beginPath(); ctx.moveTo(-16,-10); ctx.lineTo(-128,-2); ctx.lineTo(-128,12); ctx.lineTo(-14,8); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(16,-10); ctx.lineTo(128,-2); ctx.lineTo(128,12); ctx.lineTo(14,8); ctx.closePath(); ctx.fill();
  // Red wing roots (livery).
  ctx.fillStyle='#c93a2c';
  ctx.beginPath(); ctx.moveTo(-16,-10); ctx.lineTo(-128,-2); ctx.lineTo(-128,3); ctx.lineTo(-14,-2); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(16,-10); ctx.lineTo(128,-2); ctx.lineTo(128,3); ctx.lineTo(14,-2); ctx.closePath(); ctx.fill();
  // Wingtip navigation lights (red left, green right) with a soft glow.
  ctx.fillStyle='rgba(255,59,48,0.35)'; ctx.beginPath(); ctx.arc(-128,5,8,0,6.283); ctx.fill();
  ctx.fillStyle='#ff3b30'; ctx.beginPath(); ctx.arc(-128,5,3.5,0,6.283); ctx.fill();
  ctx.fillStyle='rgba(52,209,123,0.35)'; ctx.beginPath(); ctx.arc(128,5,8,0,6.283); ctx.fill();
  ctx.fillStyle='#34d17b'; ctx.beginPath(); ctx.arc(128,5,3.5,0,6.283); ctx.fill();
  // --- fuselage: SHORT and stout (foreshortened). You see its top and
  // its tail end, not a long tube — that is what makes it fly forward.
  const fus = ctx.createLinearGradient(-20,0,20,0);
  fus.addColorStop(0,'#c9c4b4');
  fus.addColorStop(0.28,'#f6f3ea');
  fus.addColorStop(0.55,'#e8e4da');
  fus.addColorStop(1,'#a49e8c');
  ctx.fillStyle = fus;
  ctx.beginPath(); ctx.ellipse(0, -2, 19, 30, 0, 0, 6.283); ctx.fill();
  // Red nose band at the far (top) end of the fuselage.
  ctx.fillStyle='#c93a2c';
  ctx.beginPath(); ctx.ellipse(0, -22, 17, 12, 0, 0, 6.283); ctx.fill();
  // Cheatline along the fuselage.
  ctx.fillStyle='rgba(201,58,44,0.9)';
  ctx.fillRect(-18, 2, 36, 3);
  // Canopy: glossy blue glass on TOP of the short fuselage, with highlight.
  const can = ctx.createLinearGradient(-11,-26,11,-4);
  can.addColorStop(0,'#bfe6f7');
  can.addColorStop(0.5,'#7ec3e8');
  can.addColorStop(1,'#3f8fc4');
  ctx.fillStyle = can;
  ctx.beginPath(); ctx.ellipse(0, -15, 11, 11, 0, 0, 6.283); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.ellipse(-3, -18, 4, 5, -0.4, 0, 6.283); ctx.fill();
  // --- tail: the CLOSEST part to the camera, so it is big and clear.
  // Horizontal stabilizer.
  ctx.fillStyle='#e8e4da';
  ctx.beginPath(); ctx.moveTo(-10,20); ctx.lineTo(-56,34); ctx.lineTo(-56,42); ctx.lineTo(-8,30); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(10,20); ctx.lineTo(56,34); ctx.lineTo(56,42); ctx.lineTo(8,30); ctx.closePath(); ctx.fill();
  // Vertical fin (red, white stripe) — the tall "up" of the tail.
  ctx.fillStyle='#c93a2c';
  ctx.beginPath(); ctx.moveTo(-11,24); ctx.lineTo(11,24); ctx.lineTo(7,52); ctx.lineTo(-7,52); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#f4f1e8';
  ctx.beginPath(); ctx.moveTo(-9,28); ctx.lineTo(9,28); ctx.lineTo(8,34); ctx.lineTo(-8,34); ctx.closePath(); ctx.fill();
  // Registration on the fin.
  ctx.fillStyle='#fff'; ctx.font='bold 8px ui-monospace, monospace';
  ctx.textAlign='center'; ctx.fillText('NUSA-1', 0, 44); ctx.textAlign='left';
  // --- landing gear: two wheels under the wings while on the ground,
  // so the takeoff shot shows the plane SITTING on the runway.
  if (S.mode==='takeoff' && S.y <= 4){
    ctx.fillStyle='#1a1a1a';
    ctx.beginPath(); ctx.arc(-34, 16, 5, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(34, 16, 5, 0, 6.283); ctx.fill();
    ctx.fillStyle='#555';
    ctx.beginPath(); ctx.arc(-34, 16, 2, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(34, 16, 2, 0, 6.283); ctx.fill();
  }
  // Speed streaks when the throttle is high.
  if (S.throttle > 0.65 && S.speed > 55){
    ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=1.5;
    for (let i=0;i<4;i++){
      const yy = -26 + i*22 + (S.time*90 % 18);
      ctx.beginPath(); ctx.moveTo(-160, yy); ctx.lineTo(-132, yy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(132, yy); ctx.lineTo(160, yy); ctx.stroke();
    }
  }
  ctx.restore();
}
function drawCockpit(){
  // Cockpit view: windshield frame + full instrument panel.
  const horizon = H*0.46 + S.pitch*420;
  // windshield view is the world already drawn; now frame it.
  ctx.fillStyle='#1c2733';
  // top bar + pillars
  ctx.fillRect(0,0,W,54);
  ctx.beginPath(); ctx.moveTo(0,54); ctx.lineTo(150,H); ctx.lineTo(210,H); ctx.lineTo(90,54); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(W,54); ctx.lineTo(W-150,H); ctx.lineTo(W-210,H); ctx.lineTo(W-90,54); ctx.closePath(); ctx.fill();
  // dashboard
  ctx.fillStyle='#232b34';
  ctx.fillRect(0,H-190,W,190);
  ctx.fillStyle='#2e3947'; ctx.fillRect(0,H-190,W,10);
  // --- instruments (six-pack) ---
  const cy = H-95;
  function dial(x, label, drawFn){
    ctx.save(); ctx.translate(x, cy);
    ctx.fillStyle='#0e141b'; ctx.beginPath(); ctx.arc(0,0,52,0,6.283); ctx.fill();
    ctx.strokeStyle='#c8d4e0'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(0,0,52,0,6.283); ctx.stroke();
    drawFn();
    ctx.fillStyle='#c8d4e0'; ctx.font='bold 11px ui-monospace, monospace';
    ctx.textAlign='center'; ctx.fillText(label, 0, 68); ctx.textAlign='left';
    ctx.restore();
  }
  // attitude indicator
  dial(150,'ATTITUDE',()=>{
    ctx.save(); ctx.rotate(-S.roll); ctx.translate(0, S.pitch*160);
    ctx.fillStyle='#4a90d9'; ctx.fillRect(-52,-52,104,52);
    ctx.fillStyle='#8a6b46'; ctx.fillRect(-52,0,104,52);
    ctx.restore();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(-52,0); ctx.lineTo(52,0); ctx.stroke();
    ctx.fillStyle='#ffd166'; ctx.beginPath(); ctx.moveTo(0,-8); ctx.lineTo(-8,4); ctx.lineTo(8,4); ctx.closePath(); ctx.fill();
  });
  // airspeed
  dial(290,'AIRSPEED',()=>{
    const kt = Math.round(S.speed*1.944);
    ctx.fillStyle='#eaf6ff'; ctx.font='bold 26px ui-monospace, monospace';
    ctx.textAlign='center'; ctx.fillText(String(kt), 0, 8); ctx.textAlign='left';
    ctx.fillStyle='#9fc3e0'; ctx.font='11px ui-monospace, monospace';
    ctx.textAlign='center'; ctx.fillText('KNOTS', 0, 28); ctx.textAlign='left';
  });
  // altimeter
  dial(430,'ALTITUDE',()=>{
    const ft = Math.round(S.y*3.281);
    ctx.fillStyle='#eaf6ff'; ctx.font='bold 24px ui-monospace, monospace';
    ctx.textAlign='center'; ctx.fillText(String(ft), 0, 8); ctx.textAlign='left';
    ctx.fillStyle='#9fc3e0'; ctx.font='11px ui-monospace, monospace';
    ctx.textAlign='center'; ctx.fillText('FEET', 0, 28); ctx.textAlign='left';
  });
  // heading / compass
  dial(570,'HEADING',()=>{
    const hd = ((S.heading*57.2958)%360+360)%360;
    ctx.fillStyle='#eaf6ff'; ctx.font='bold 26px ui-monospace, monospace';
    ctx.textAlign='center'; ctx.fillText(String(Math.round(hd)).padStart(3,'0')+'°', 0, 8); ctx.textAlign='left';
    ctx.fillStyle='#ffd166'; ctx.font='bold 12px ui-monospace, monospace';
    ctx.textAlign='center';
    ctx.fillText(['N','NE','E','SE','S','SW','W','NW'][Math.round(hd/45)%8], 0, 28);
    ctx.textAlign='left';
  });
  // throttle gauge
  dial(710,'THROTTLE',()=>{
    ctx.fillStyle='#0e141b'; ctx.fillRect(-34,-30,68,60);
    ctx.fillStyle='#34d17b'; ctx.fillRect(-34,30-S.throttle*60,68,S.throttle*60);
    ctx.fillStyle='#eaf6ff'; ctx.font='bold 20px ui-monospace, monospace';
    ctx.textAlign='center'; ctx.fillText(Math.round(S.throttle*100)+'%', 0, 8); ctx.textAlign='left';
  });
  // rings / score
  dial(850,'RINGS',()=>{
    ctx.fillStyle='#ffd166'; ctx.font='bold 26px ui-monospace, monospace';
    ctx.textAlign='center'; ctx.fillText(S.rings+' / 8', 0, 8); ctx.textAlign='left';
    ctx.fillStyle='#9fc3e0'; ctx.font='11px ui-monospace, monospace';
    ctx.textAlign='center'; ctx.fillText('SCORE '+S.score, 0, 28); ctx.textAlign='left';
  });
  // yoke (control wheel): a full ring with hub and spokes, so it reads
  // as a finished instrument instead of an empty arc.
  const yx = 1050, yy = H-95, yr = 42;
  ctx.strokeStyle='#4a5a6c'; ctx.lineWidth=9;
  ctx.beginPath(); ctx.arc(yx, yy, yr, 0, 6.283); ctx.stroke();
  ctx.strokeStyle='#2a3542'; ctx.lineWidth=5;
  ctx.beginPath(); ctx.moveTo(yx-yr*0.7, yy-yr*0.7); ctx.lineTo(yx+yr*0.7, yy+yr*0.7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(yx+yr*0.7, yy-yr*0.7); ctx.lineTo(yx-yr*0.7, yy+yr*0.7); ctx.stroke();
  ctx.fillStyle='#5a6b7d'; ctx.beginPath(); ctx.arc(yx, yy, 11, 0, 6.283); ctx.fill();
  ctx.fillStyle='#c8d4e0'; ctx.beginPath(); ctx.arc(yx, yy, 5, 0, 6.283); ctx.fill();
  ctx.strokeStyle='#3a4756'; ctx.lineWidth=10;
  ctx.beginPath(); ctx.moveTo(yx, yy+yr); ctx.lineTo(yx, H-8); ctx.stroke();
  ctx.fillStyle='#c8d4e0'; ctx.font='bold 12px ui-monospace, monospace';
  ctx.fillText('NUSA-1 · ARCHIPELAGO RUN', 1000, H-160);
  // compass strip along the top of the panel
  ctx.fillStyle='#0e141b'; ctx.fillRect(0, 54, W, 0);
}
function drawHUD(){
  // In cockpit view the instrument panel carries the flight data, so the
  // two corner boxes are hidden there (less clutter over the windshield).
  const showCorners = S.view !== 'cockpit';
  const mm = String(Math.floor(S.time/60)).padStart(2,'0'),
        ss = String(Math.floor(S.time%60)).padStart(2,'0');
  if (showCorners){
  // top-left flight data
  const kt = Math.round(S.speed*1.944);
  const ft = Math.round(S.y*3.281);
  const hd = ((S.heading*57.2958)%360+360)%360;
  ctx.fillStyle='rgba(8,20,36,0.62)'; ctx.fillRect(14,14,300,96);
  ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=1; ctx.strokeRect(14,14,300,96);
  ctx.fillStyle='#9fd8ef'; ctx.font='bold 12px ui-monospace, monospace';
  ctx.fillText('ALTITUDE', 26, 36); ctx.fillText('SPEED', 26, 62); ctx.fillText('HEADING', 26, 88);
  ctx.fillStyle='#fff'; ctx.font='bold 20px ui-monospace, monospace';
  ctx.fillText(ft.toLocaleString()+' FT', 130, 38);
  ctx.fillText(kt+' KT', 130, 64);
  ctx.fillText(String(Math.round(hd)).padStart(3,'0')+'°', 130, 90);
  // top-right score
  ctx.fillStyle='rgba(8,20,36,0.62)'; ctx.fillRect(W-254,14,240,96);
  ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.strokeRect(W-254,14,240,96);
  ctx.fillStyle='#ffd166'; ctx.font='bold 12px ui-monospace, monospace';
  ctx.fillText('SCORE', W-242, 36); ctx.fillText('RINGS', W-242, 62); ctx.fillText('TIME', W-242, 88);
  ctx.fillStyle='#fff'; ctx.font='bold 20px ui-monospace, monospace';
  ctx.fillText(String(S.score), W-150, 38);
  ctx.fillText(S.rings+' / 8', W-150, 64);
  ctx.fillText(mm+':'+ss, W-150, 90);
  }
  // throttle bar (bottom-left)
  ctx.fillStyle='rgba(8,20,36,0.62)'; ctx.fillRect(14,H-46,220,32);
  ctx.fillStyle='#34d17b'; ctx.fillRect(22,H-38,204*S.throttle,16);
  ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.strokeRect(22,H-38,204,16);
  ctx.fillStyle='#fff'; ctx.font='bold 11px ui-monospace, monospace';
  ctx.fillText('THR '+Math.round(S.throttle*100)+'%', 24, H-50);
  // --- compass strip (top-centre): heading tape with cardinal points ---
  if (showCorners){
    const hd = ((S.heading*57.2958)%360+360)%360;
    const cw = 360, ch = 30, cx0 = W/2 - cw/2, cy0 = 14;
    ctx.fillStyle='rgba(8,20,36,0.62)'; ctx.fillRect(cx0, cy0, cw, ch);
    ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.strokeRect(cx0, cy0, cw, ch);
    ctx.save();
    ctx.beginPath(); ctx.rect(cx0, cy0, cw, ch); ctx.clip();
    for (let off=-180; off<=180; off+=15){
      const h = (Math.round(hd) + off + 360) % 360;
      const px = W/2 + off * 2;
      const isCard = h % 90 === 0;
      ctx.strokeStyle = isCard ? 'rgba(255,209,102,0.9)' : 'rgba(255,255,255,0.45)';
      ctx.lineWidth = isCard ? 2 : 1;
      ctx.beginPath(); ctx.moveTo(px, cy0 + ch - 8); ctx.lineTo(px, cy0 + ch - (isCard ? 2 : 5)); ctx.stroke();
      if (isCard){
        const lbl = h===0?'N':h===90?'E':h===180?'S':'W';
        ctx.fillStyle='#ffd166'; ctx.font='bold 12px ui-monospace, monospace';
        ctx.textAlign='center'; ctx.fillText(lbl, px, cy0 + 13); ctx.textAlign='left';
      }
    }
    ctx.restore();
    // centre caret + current heading readout
    ctx.fillStyle='#ffd166';
    ctx.beginPath(); ctx.moveTo(W/2-6, cy0+ch); ctx.lineTo(W/2+6, cy0+ch); ctx.lineTo(W/2, cy0+ch-7); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 13px ui-monospace, monospace';
    ctx.textAlign='center';
    ctx.fillText(String(Math.round(hd)).padStart(3,'0')+'°', W/2, cy0 + ch + 16);
    ctx.textAlign='left';
    // --- next-ring indicator (under the compass) ---
    const nxt = RINGS.find(r=>!r.passed);
    if (nxt){
      const dz = nxt.z - S.z, dx = nxt.x - S.x;
      const dist = Math.round(Math.hypot(dx, dz));
      const ang = Math.atan2(dx, dz) - S.heading;
      let arrow = '↑';
      if (ang > 0.5) arrow = '↗';
      else if (ang < -0.5) arrow = '↖';
      else if (ang > 0.15) arrow = '→';
      else if (ang < -0.15) arrow = '←';
      const label = 'NEXT RING ' + (RINGS.indexOf(nxt)+1) + '  ' + arrow + '  ' + dist.toLocaleString() + ' M';
      ctx.fillStyle='rgba(8,20,36,0.62)';
      const lw = ctx.measureText(label).width + 28;
      ctx.fillRect(W/2 - lw/2, cy0 + ch + 22, lw, 26);
      ctx.strokeStyle='rgba(255,209,102,0.6)'; ctx.strokeRect(W/2 - lw/2, cy0 + ch + 22, lw, 26);
      ctx.fillStyle='#ffd166'; ctx.font='bold 14px ui-monospace, monospace';
      ctx.textAlign='center'; ctx.fillText(label, W/2, cy0 + ch + 40); ctx.textAlign='left';
    }
    // --- minimap (bottom-right): the archipelago from above ---
    const mx = W - 254, my = H - 206, mw = 240, mh = 150;
    ctx.fillStyle='rgba(8,20,36,0.72)'; ctx.fillRect(mx, my, mw, mh);
    ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.strokeRect(mx, my, mw, mh);
    ctx.fillStyle='#9fd8ef'; ctx.font='bold 11px ui-monospace, monospace';
    ctx.fillText('MAP — ARCHIPELAGO', mx + 8, my + 15);
    const mapX = x => mx + 12 + (x + 1000) / 2000 * (mw - 24);
    const mapZ = z => my + mh - 10 - (z / 9000) * (mh - 30);
    // sea + route line
    ctx.fillStyle='rgba(30,110,160,0.5)'; ctx.fillRect(mx+12, my+22, mw-24, mh-32);
    ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(mapX(0), mapZ(0)); ctx.lineTo(mapX(0), mapZ(9000)); ctx.stroke();
    ctx.setLineDash([]);
    // islands
    for (const isl of ISLANDS){
      ctx.fillStyle='rgba(90,180,90,0.9)';
      ctx.beginPath(); ctx.arc(mapX(isl.x), mapZ(isl.z), 4, 0, 6.283); ctx.fill();
    }
    // rings: passed = filled gold, next = pulsing outline, future = dim
    RINGS.forEach((r, i)=>{
      const px = mapX(r.x), py = mapZ(r.z);
      if (r.passed){
        ctx.fillStyle='#ffd166'; ctx.beginPath(); ctx.arc(px, py, 3.5, 0, 6.283); ctx.fill();
      } else if (nxt === r){
        ctx.strokeStyle='#ffd166'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(px, py, 6, 0, 6.283); ctx.stroke();
      } else {
        ctx.strokeStyle='rgba(255,209,102,0.45)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.arc(px, py, 3, 0, 6.283); ctx.stroke();
      }
    });
    // destination runway marker
    ctx.fillStyle='#ff6b5e'; ctx.fillRect(mapX(0)-5, mapZ(9000)-2, 10, 4);
    // plane (white triangle, rotated by heading)
    const px = mapX(S.x), py = mapZ(S.z);
    ctx.save(); ctx.translate(px, py); ctx.rotate(S.heading);
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.moveTo(0,-7); ctx.lineTo(5,6); ctx.lineTo(-5,6); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.fillStyle='#cfe6ff'; ctx.font='10px ui-monospace, monospace';
    ctx.fillText('KARANG', mx+8, my+mh-14);
    ctx.fillText('BINTANG', mx+mw-58, my+24);
  }
  // centre crosshair / flight-path marker
  ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=2;
  const cx=W/2, cy=H*0.46;
  ctx.beginPath(); ctx.arc(cx,cy,14,0,6.283); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx-22,cy); ctx.lineTo(cx-8,cy); ctx.moveTo(cx+8,cy); ctx.lineTo(cx+22,cy);
  ctx.moveTo(cx,cy-22); ctx.lineTo(cx,cy-8); ctx.moveTo(cx,cy+8); ctx.lineTo(cx,cy+22); ctx.stroke();
  // messages (opaque box: the old 0.72 alpha let rings and mountains
  // show through and fight with the text).
  if (S.msgT>0){
    ctx.fillStyle='rgba(8,20,36,0.94)';
    const w = ctx.measureText(S.msg).width + 48;
    ctx.fillRect(W/2-w/2, 128, w, 40);
    ctx.strokeStyle='rgba(255,209,102,0.5)'; ctx.lineWidth=1;
    ctx.strokeRect(W/2-w/2, 128, w, 40);
    ctx.fillStyle='#ffd166'; ctx.font='bold 18px ui-monospace, monospace';
    ctx.textAlign='center'; ctx.fillText(S.msg, W/2, 155); ctx.textAlign='left';
  }
  // start / end screens
  if (!S.started){
    ctx.fillStyle='rgba(6,16,30,0.55)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffd166'; ctx.font='bold 54px ui-monospace, monospace';
    ctx.textAlign='center'; ctx.fillText('ARCHIPELAGO RUN', W/2, 250);
    ctx.fillStyle='#fff'; ctx.font='bold 24px ui-monospace, monospace';
    ctx.fillText('Fly Nusa-1 from Pulau Karang to Pulau Bintang', W/2, 300);
    ctx.font='17px ui-monospace, monospace'; ctx.fillStyle='#cfe6ff';
    ctx.fillText('Through 8 golden rings — then land on Runway 27.', W/2, 334);
    ctx.fillStyle='#34d17b'; ctx.font='bold 22px ui-monospace, monospace';
    ctx.fillText('CLICK OR PRESS ANY KEY TO FLY', W/2, 400);
    ctx.textAlign='left';
  }
  if (S.mode==='done'){
    ctx.fillStyle='rgba(6,16,30,0.6)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffd166'; ctx.font='bold 48px ui-monospace, monospace';
    ctx.textAlign='center'; ctx.fillText('FLIGHT COMPLETE', W/2, 300);
    ctx.fillStyle='#fff'; ctx.font='bold 26px ui-monospace, monospace';
    ctx.fillText('Score '+S.score+'  ·  Rings '+S.rings+'/8  ·  Time '+mm+':'+ss, W/2, 356);
    ctx.fillStyle='#34d17b'; ctx.font='bold 20px ui-monospace, monospace';
    ctx.fillText('PRESS R TO FLY AGAIN', W/2, 410);
    ctx.textAlign='left';
  }
  if (S.mode==='crashed'){
    ctx.fillStyle='rgba(40,6,6,0.55)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ff6b5e'; ctx.font='bold 48px ui-monospace, monospace';
    ctx.textAlign='center'; ctx.fillText('CRASHED', W/2, 300);
    ctx.fillStyle='#fff'; ctx.font='bold 22px ui-monospace, monospace';
    ctx.fillText('The Nusa-1 went down. Press R to try again.', W/2, 356);
    ctx.textAlign='left';
  }
  if (S.paused){
    ctx.fillStyle='rgba(6,16,30,0.6)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff'; ctx.font='bold 40px ui-monospace, monospace';
    ctx.textAlign='center'; ctx.fillText('PAUSED', W/2, 360); ctx.textAlign='left';
  }
}

// ---------- scene presets (for screenshots) ----------
// ?scene=takeoff | ring | landing | cockpit
function applyScene(){
  const q = new URLSearchParams(location.search);
  const scene = q.get('scene');
  if (!scene) return;
  S.started = true;
  if (scene==='takeoff'){
    S.mode='takeoff'; S.speed=30; S.throttle=0.85; S.y=GROUND_Y; S.z=0;
    showMsg('TAKEOFF — RUNWAY 09, PULAU KARANG', 4);
  } else if (scene==='ring'){
    S.mode='flying'; S.speed=62; S.throttle=0.7; S.y=330; S.z=2900; S.x=380;
    S.heading=0.05; S.pitch=0.05; S.roll=0.55; S.rings=3; S.score=300; S.time=74;
    RINGS[0].passed = RINGS[1].passed = RINGS[2].passed = true;
    showMsg('RING 4/8  +100', 3);
  } else if (scene==='landing'){
    S.mode='flying'; S.speed=36; S.throttle=0.3; S.y=32; S.z=8750; S.x=0;
    S.heading=0; S.pitch=-0.08; S.rings=8; S.score=800; S.time=186;
    RINGS.forEach(r=>r.passed=true);
    showMsg('FINAL — RUNWAY 27, PULAU BINTANG', 4);
  } else if (scene==='cockpit'){
    S.view='cockpit'; S.mode='flying'; S.speed=68; S.throttle=0.75; S.y=420; S.z=4900; S.x=60;
    S.heading=-0.04; S.pitch=0.02; S.rings=5; S.score=500; S.time=122;
    for (let i=0;i<5;i++) RINGS[i].passed = true;
  }
}

// ---------- main loop ----------
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  update(dt);
  ctx.save();
  if (S.camShake>0) ctx.translate((Math.random()-0.5)*S.camShake*8,(Math.random()-0.5)*S.camShake*8);
  drawSky();
  drawClouds();
  drawPeaks();
  drawSeaAndIslands();
  drawRunway(0, 0, 0, '09');          // departure runway, Pulau Karang
  drawRunway(0, 9000, 0, '27');     // destination runway, Pulau Bintang
  drawRings();
  drawBirds();
  if (S.view==='chase') drawPlane();
  if (S.view==='cockpit') drawCockpit();
  drawHUD();
  ctx.restore();
  requestAnimationFrame(frame);
}
applyScene();
requestAnimationFrame(frame);
// Any key starts the game too (but not the control keys R / P / C,
// which have their own jobs and would otherwise re-start it instantly).
window.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if (!S.started && k!=='r' && k!=='p' && k!=='c') startGame();
});
</script>
